[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterlife-offline"
version = "0.1.0"
description = "Compile declarative record applications into self-contained offline HTML"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
afterlife = "afterlife.__main__:main"

[tool.setuptools]
packages = ["afterlife"]

[tool.setuptools.package-data]
afterlife = ["runtime.js", "style.css"]
